name: Test
on: [push, pull_request]
permissions:
  contents: read
env:
  # CI runs build/test explicitly and does not need developer Git hook installers.
  npm_config_ignore_scripts: 'true'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
  Test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22.x, 24.x]
        hexo: ['6.3.0', '8.1.2']
        include:
          - os: macos-latest
            node: 22.x
            hexo: '6.3.0'
          - os: windows-latest
            node: 22.x
            hexo: '6.3.0'
    runs-on: ${{ matrix.os }}
    env:
      HEXO_TEST_VERSION: ${{ matrix.hexo }}
    steps:
      - run: git config --global core.autocrlf false
      - run: git config --global core.eol lf
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install -g hexo-cli@4.3.2
      - run: npm test
