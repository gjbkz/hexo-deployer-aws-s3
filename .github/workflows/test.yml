name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
env:
  # CI runs build/test explicitly and does not need developer Git hook installers.
  npm_config_ignore_scripts: 'true'
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
  Test:
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22.x, 24.x]
        hexo: ['6.3.0', '8.1.2']
        include:
          - os: ubuntu-latest
            node: 22.x
            hexo: '6.3.0'
            coverage: true
          - os: macos-latest
            node: 22.x
            hexo: '6.3.0'
          - os: windows-latest
            node: 22.x
            hexo: '6.3.0'
    runs-on: ${{ matrix.os }}
    env:
      HEXO_TEST_VERSION: ${{ matrix.hexo }}
      TS_NODE_TRANSPILE_ONLY: 'true'
    steps:
      - run: git config --global core.autocrlf false
      - run: git config --global core.eol lf
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install -g hexo-cli@4.3.2
      - run: npm test
        if: ${{ !matrix.coverage }}
      - run: npx --yes c8@10.1.3 --reporter=lcov --reporter=text npm test
        if: matrix.coverage
      - uses: codecov/codecov-action@v5
        if: matrix.coverage
        with:
          files: coverage/lcov.info
          use_oidc: true
          fail_ci_if_error: true
